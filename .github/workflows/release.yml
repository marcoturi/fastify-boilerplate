name: Release
on:
  push:
    branches:
      - main

permissions:
  contents: read # for checkout

# One release at a time: a push that lands while a release runs waits for it, instead of
# racing it to the same tag. Never cancelled, so a release is not stopped halfway
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # semantic-release writes with GH_TOKEN (push, GitHub release, comments), not with this token
    permissions:
      contents: read # for checkout
      id-token: write # to enable use of OIDC for npm provenance

    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_DB: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_USER: postgres
        ports:
          - 5432:5432
        # Set health checks to wait until postgres has started
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          # semantic-release pushes the release commit with GH_TOKEN (an admin PAT, allowed to
          # bypass the main ruleset), not with the github-actions credentials checkout keeps
          persist-credentials: false
      - name: Install pnpm
        uses: pnpm/action-setup@v6
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: ".nvmrc"
          cache: "pnpm"
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Check lint, types, and formatting
        run: pnpm check
      - name: Run tests
        run: pnpm test
      - name: Validate architecture boundaries
        run: pnpm deps:validate
      - name: Migrate DB
        run: pnpm db:migrate
        env:
          DBMATE_DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres?sslmode=disable
      - name: Run e2e tests
        run: pnpm test:e2e
        env:
          POSTGRES_URL: localhost:5432
          POSTGRES_PASSWORD: postgres
          POSTGRES_USER: postgres
          POSTGRES_DB: postgres
          LOG_LEVEL: error
          NODE_ENV: test
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: reports
          path: reports/
          retention-days: 30
      - name: Generate client types
        run: pnpm generate:types
        env:
          POSTGRES_URL: localhost:5432
          POSTGRES_PASSWORD: postgres
          POSTGRES_USER: postgres
          POSTGRES_DB: postgres
          LOG_LEVEL: error
          NODE_ENV: test
      - name: Release
        env:
          GITHUB_TOKEN: ${{ secrets.GH_TOKEN }}
          HUSKY: 0
        run: pnpm semantic-release
